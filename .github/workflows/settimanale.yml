name: Analisi giornata

on:
  schedule:
    # due volte al giorno (ore UTC): prende designazioni, variazioni e risultati appena escono
    - cron: "0 9 * * *"
    - cron: "0 16 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: analisi
  cancel-in-progress: false

jobs:
  analisi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy
      - name: Analizza la giornata
        run: python settimanale.py
      - name: Salva i risultati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add docs/dati.json dati/
          if git diff --cached --quiet; then echo "Niente di nuovo"; else git commit -m "Aggiornamento automatico $(date -u +%Y-%m-%dT%H:%M)" && git push; fi
